name: Update wiki data

# Snapshots operator, weapon, gear, event reward, regular income, medal and
# Intel Archive data (and their pictures and icons) from endfield.wiki.gg
# into wiki/.
# Changes arrive as a pull request to review; nothing is pushed to main
# directly. Weekly is plenty: the wiki fills in a new operator within days.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-wiki
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # No npm ci: the script only uses Node's built-ins.
      - name: Update wiki/*.json
        run: node scripts/update-wiki.mjs 2>&1 | tee report.txt
      # Medals first: event rewards counts the event medals among an event's unique rewards.
      - name: Medals and Intel Archives (wiki/medals.json, wiki/findings.json)
        run: node scripts/wiki-collections.mjs 2>&1 | tee -a report.txt
      - name: Event rewards (wiki/events.json)
        run: node scripts/event-rewards.mjs 2>&1 | tee -a report.txt
      - name: Regular income (wiki/income.json)
        run: node scripts/income.mjs 2>&1 | tee -a report.txt
      - name: Exact income amounts from the game's tables (wiki/income.json, from the EndfieldData dump)
        run: node scripts/game-income.mjs 2>&1 | tee -a report.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install pillow
      - name: Icons for new gear
        run: python scripts/gear-icons.py 2>&1 | tee -a report.txt
      - name: Icons for new items, elements, classes and weapon types
        run: python scripts/item-icons.py 2>&1 | tee -a report.txt
      - name: Pictures for new medals and findings (collections/)
        run: python scripts/collection-pictures.py 2>&1 | tee -a report.txt
      - name: Portraits for new operators and weapons (operators/, arsenals/)
        run: python scripts/portraits.py 2>&1 | tee -a report.txt
      - name: Story text (story/, from the EndfieldData dump)
        run: node scripts/story.mjs 2>&1 | tee -a report.txt
      - name: AIC planner data (aic/planner.json, from the EndfieldData dump)
        run: node scripts/aic.mjs 2>&1 | tee -a report.txt
      - name: Write the pull request text
        run: |
          {
            echo 'Automated snapshot from endfield.wiki.gg (CC BY-SA 4.0).'
            echo
            echo '```'
            cat report.txt
            echo '```'
          } > pr-body.md
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/update-wiki
          commit-message: Update wiki data from endfield.wiki.gg
          title: Update wiki data
          body-path: pr-body.md
          add-paths: |
            wiki/*.json
            gear/*.webp
            icons/**
            collections/**
            operators/*.webp
            arsenals/*.webp
            story/**
            aic/*.json
          delete-branch: true

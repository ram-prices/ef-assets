name: Update wiki data

# Snapshots operator, weapon, gear, event reward, regular income, medal and
# Intel Archive data (and their pictures and icons) from endfield.wiki.gg
# into wiki/. scripts/site-art.mjs then copies new banner art to the paths the
# site loads, flags game-screen art in banners.json and lists what is still
# missing (needs.md, with the wiki warnings).
#
# Changes are committed straight to main (no pull request to merge); Cloudflare
# Pages deploys main to assets.itjustlogs.dev on every push. Whatever still
# needs a hand (needs.md, or this run failing) goes into the "ef-assets:
# needs attention" issue, assigned to
# and mentioning ram-prices (scripts/needs-issue.mjs); it closes itself once
# nothing is listed. Weekly is plenty: the wiki fills in a new operator
# within days.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: update-wiki
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # No npm ci: the script only uses Node's built-ins.
      - name: Update wiki/*.json
        run: node scripts/update-wiki.mjs 2>&1 | tee report.txt
      # Medals first: event rewards counts the event medals among an event's unique rewards.
      - name: Medals and Intel Archives (wiki/medals.json, wiki/findings.json)
        run: node scripts/wiki-collections.mjs 2>&1 | tee -a report.txt
      - name: Event rewards (wiki/events.json)
        run: node scripts/event-rewards.mjs 2>&1 | tee -a report.txt
      - name: Regular income (wiki/income.json)
        run: node scripts/income.mjs 2>&1 | tee -a report.txt
      - name: Exact income amounts from the game's tables (wiki/income.json, from the EndfieldData dump)
        run: node scripts/game-income.mjs 2>&1 | tee -a report.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install pillow
      - name: Icons for new gear
        run: python scripts/gear-icons.py 2>&1 | tee -a report.txt
      - name: Icons for new items, elements, classes and weapon types
        run: python scripts/item-icons.py 2>&1 | tee -a report.txt
      - name: Pictures for new medals and findings (collections/)
        run: python scripts/collection-pictures.py 2>&1 | tee -a report.txt
      - name: Portraits for new operators and weapons (operators/, arsenals/)
        run: python scripts/portraits.py 2>&1 | tee -a report.txt
      - name: Card art for new operators (operators/bust-3/, from the official site)
        run: python scripts/operator-cards.py 2>&1 | tee -a report.txt
      - name: Story text (story/, from the EndfieldData dump)
        run: node scripts/story.mjs 2>&1 | tee -a report.txt
      - name: AIC planner data (aic/planner.json, from the EndfieldData dump)
        run: node scripts/aic.mjs 2>&1 | tee -a report.txt
      - name: Banner art where the site loads it, gameArt flags, needs.md (with the wiki warnings)
        run: node scripts/site-art.mjs --wiki-report report.txt
      - name: Commit to main
        run: |
          git add -- 'wiki/*.json' 'gear/*.webp' 'icons/**' 'collections/**' 'operators/*.webp' 'arsenals/*.webp' \
            'story/**' 'aic/*.json' banners.json 'banners/*.webp' 'banners/layers/*.webp'
          if git diff --cached --quiet; then echo 'Nothing changed.'; exit 0; fi
          git commit -q -m 'Update wiki data from endfield.wiki.gg'
          for attempt in 1 2; do
            git pull -q --rebase && git push && exit 0
            echo 'Push rejected; trying once more.'
          done
          exit 1
      - name: Keep the "ef-assets needs attention" issue up to date
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: node scripts/needs-issue.mjs wiki
